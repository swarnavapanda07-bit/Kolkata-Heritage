<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ place.name }} - Kolkata Heritage</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;
        }

        .container {
            max-width: 900px;

            margin: 40px auto;

            padding: 20px;
        }

        .box {
            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #8b0000;

            font-size: 40px;

            margin-top: 0;
        }

        h2 {
            color: #8b0000;

            margin-top: 35px;
        }

        p {
            font-size: 17px;

            line-height: 1.8;

            color: #444;
        }

        .info {
            background: #fff4f4;

            padding: 20px;

            border-left: 5px solid #8b0000;

            border-radius: 8px;

            margin-top: 25px;
        }

        .info p {
            margin: 12px 0;
        }

        .map {
            margin-top: 25px;
        }

        iframe {
            width: 100%;

            height: 400px;

            border: 0;

            border-radius: 10px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;

            padding: 12px 20px;

            background: #8b0000;

            color: white;

            text-decoration: none;

            border-radius: 7px;

            margin-right: 10px;
        }

        .button:hover {
            background: #5f0000;
        }

        .direction {
            background: #006400;
        }

        .direction:hover {
            background: #004d00;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">


        <h1>
            {{ place.name }}
        </h1>


        <h2>
            📖 About
        </h2>

        <p>
            {{ place.description }}
        </p>


        <h2>
            🏛️ History
        </h2>

        <p>
            {{ place.history }}
        </p>


        <div class="info">

            <p>
                <strong>📍 Location:</strong>
                {{ place.location }}
            </p>

            <p>
                <strong>🕐 Timings:</strong>
                {{ place.timings }}
            </p>

            <p>
                <strong>💰 Entry Fee:</strong>
                {{ place.entry_fee }}
            </p>

            <p>
                <strong>🌤️ Best Time to Visit:</strong>
                {{ place.best_time }}
            </p>

        </div>


        <h2>
            📍 Location on Map
        </h2>


        <div class="map">

            <iframe
                src="https://www.google.com/maps?q={{ place.latitude }},{{ place.longitude }}&output=embed"
                loading="lazy">
            </iframe>

        </div>


        <div class="buttons">

            <a
                class="button"
                href="/"
            >
                ← Back to Kolkata
            </a>


            <a
                class="button direction"
                href="https://www.google.com/maps/dir/?api=1&destination={{ place.latitude }},{{ place.longitude }}"
                target="_blank"
            >
                🧭 Get Directions
            </a>

        </div>


    </div>


</div>


</body>

</html>
